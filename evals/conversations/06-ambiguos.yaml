# Datos ambiguos o incompletos (6): respuestas cortas, errores de escritura, adjuntos.
group: ambiguos
cases:
  - id: amb-typo-01
    turns: ['ola', 'la a porfa', 'me yamo jhon', 'tgo', 'rede sociales', 'kiero ese', 'SÍ AUTORIZO']
    expect: { finalStageIn: [TRANSFERENCIA, OFERTA, AUTORIZACION] }
  - id: amb-corto-01
    turns: ['Hola', 'A', 'ok', 'sí', 'mmm']
    expect: { finalStage: PERFIL }
  - id: amb-audio-01
    turns: ['Hola', 'B', '[audio]']
    expect: { finalStage: PERFIL }
  # D-010: notas de voz (🎤 = nota de voz con la transcripción simulada; 🎤 ~ = no se entiende).
  - id: voz-perfil-01
    turns: ['Hola', 'B', '🎤 Me llamo Sofía y uso el celular para redes sociales y música']
    expect: { finalStageIn: [PERFIL, OFERTA], process: MIGRACION }
  - id: voz-menu-01
    turns: ['Hola', '🎤 la opción A, quiero traer mi número de Movistar']
    expect: { finalStageIn: [PERFIL, OFERTA], process: PORTABILIDAD }
  - id: voz-ininteligible-01
    turns: ['Hola', 'B', '🎤 ~']
    expect: { finalStage: PERFIL, forbidden: ['precio'] }
  - id: voz-objecion-01
    turns:
      [
        'Hola',
        'B',
        'Mi nombre es Andrés',
        'redes sociales y videos',
        '🎤 uy no, está muy caro, ¿no hay algo más barato?',
      ]
    expect: { finalStageIn: [OFERTA, OBJECIONES] }
  - id: amb-imagen-01
    turns: ['Hola', 'B', 'Diana', '[imagen]']
    expect: { finalStage: PERFIL }
  - id: amb-todo-junto-01
    turns: ['Hola', 'A', 'Soy Karen, tengo Movistar y uso mucho redes y videos']
    expect: { finalStage: OFERTA, process: PORTABILIDAD }
  - id: amb-menu-libre-01
    turns: ['Hola', 'pues la verdad quiero pasarme de prepago a pospago']
    expect: { finalStage: PERFIL, process: MIGRACION }
