# Autorización (7): autoriza, no autoriza (se ofrece asesor, D-003), ambigua, cambia de opinión.
group: autorizacion
cases:
  - id: aut-si-01
    turns: ['Hola', 'B', 'Mónica', 'redes', 'lo tomo', 'SÍ AUTORIZO']
    expect: { finalStage: TRANSFERENCIA, sale: true }
  - id: aut-no-01
    turns: ['Hola', 'B', 'Hernán', 'redes', 'lo tomo', 'No', 'no gracias']
    expect: { finalStage: CIERRE_SIN_VENTA, sale: false }
  - id: aut-no-asesor-01
    turns: ['Hola', 'A', 'Patricia', 'Tigo', 'trabajo', 'ese me sirve', 'No', 'sí, por favor']
    expect: { finalStage: ESCALAR, sale: false }
  - id: aut-ambigua-01
    turns: ['Hola', 'B', 'Liliana', 'videos', 'me quedo con ese', 'ok']
    expect: { finalStage: AUTORIZACION, sale: false }
  - id: aut-ambigua-02
    turns: ['Hola', 'A', 'Fernando', 'Tigo', 'llamadas', 'listo, ese', 'bueno dale']
    expect: { finalStage: AUTORIZACION, sale: false }
  - id: aut-cambia-01
    turns: ['Hola', 'B', 'Alicia', 'redes', 'lo quiero', '¿para qué es eso?', 'SÍ AUTORIZO']
    expect: { finalStage: TRANSFERENCIA, sale: true }
  - id: aut-cambia-02
    turns:
      [
        'Hola',
        'B',
        'Rubén',
        'videos',
        'ese me sirve',
        'no sé, me da desconfianza',
        'No',
        'SÍ AUTORIZO',
      ]
    expect: { finalStage: TRANSFERENCIA, sale: true }
