packages:
  - 'apps/*'
  - 'packages/*'
  - 'evals'

allowBuilds:
  '@prisma/engines': true
  prisma: true
  msgpackr-extract: true
  esbuild: true
  '@embedded-postgres/windows-x64': true
  # CI (ubuntu-latest): PostgreSQL temporal de las pruebas de integración.
  '@embedded-postgres/linux-x64': true
  # Mac con Apple Silicon (desarrollo local).
  '@embedded-postgres/darwin-arm64': true

# Correcciones de seguridad en dependencias transitivas del CLI de Prisma (F8).
overrides:
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'
  # exceljs (Brains, v1.9) trae uuid@8: GHSA-w5hq-g745-h8pq.
  'uuid@<11.1.1': '^11.1.1'
  # Revisión de seguridad 04/11/2026 (pnpm audit): solo subidas de parche, misma versión mayor.
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'
  'multer@>=2.0.0 <2.5.0': '^2.5.0'
  'qs@>=6.7.0 <6.16.1': '^6.16.1'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
